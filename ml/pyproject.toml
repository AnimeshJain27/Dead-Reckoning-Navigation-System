[project]
name = "idr-ml"
version = "0.1.0"
description = "Machine learning and offline dataset pipeline for IDR 26168"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "pyarrow>=15.0.0",
    "torch>=2.2.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.17.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
